const d64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const subtle=crypto.subtle,enc=new TextEncoder(),dec=new TextDecoder();
async function open(K){
  const kKey=await subtle.importKey('raw',K,'AES-GCM',false,['decrypt']);
  const pt=await subtle.decrypt({name:'AES-GCM',iv:d64(DATA.ivP)},kKey,d64(DATA.ct));
  const html=dec.decode(pt);
  // ★ 版面 bug 修復（沿用快剪工坊 2026-08-20 的教訓）：解密是 async，
  //   若此時 HTML 解析器還在跑，document.open() 依規格是 no-op，登入頁的
  //   body{display:flex} 不會被清掉，整份工具會被擠成 flex 橫列。
  //   所以：先等解析結束，再親手清掉登入頁的樣式與節點，最後才寫入工具。
  if(document.readyState==='loading')
    await new Promise(r=>document.addEventListener('DOMContentLoaded',r,{once:true}));
  document.querySelectorAll('style,link[rel=stylesheet]').forEach(n=>n.remove());
  document.body.removeAttribute('class');document.body.removeAttribute('style');
  while(document.body.firstChild)document.body.removeChild(document.body.firstChild);
  document.open();document.write(html);document.close();
}
(async()=>{ // 記住我：曾成功登入就直接開
  try{
    const hex=localStorage.getItem('yti_k');
    if(hex){await open(Uint8Array.from(hex.match(/../g),h=>parseInt(h,16)));}
  }catch(e){localStorage.removeItem('yti_k');}
})();
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const u=document.getElementById('u').value.trim();
  const p=document.getElementById('p').value;
  const err=document.getElementById('err'),busy=document.getElementById('busy');
  err.style.display='none';busy.style.display='block';
  await new Promise(r=>setTimeout(r,30));
  const a=DATA.accounts.find(x=>x.u.toLowerCase()===u.toLowerCase());
  if(!a){busy.style.display='none';err.style.display='block';return;}
  try{
    const base=await subtle.importKey('raw',enc.encode(p),'PBKDF2',false,['deriveKey']);
    const kek=await subtle.deriveKey({name:'PBKDF2',salt:d64(a.s),iterations:DATA.iter,hash:'SHA-256'},
      base,{name:'AES-GCM',length:256},false,['decrypt']);
    const K=new Uint8Array(await subtle.decrypt({name:'AES-GCM',iv:d64(a.i)},kek,d64(a.w)));
    if(document.getElementById('rm').checked)
      localStorage.setItem('yti_k',[...K].map(b=>b.toString(16).padStart(2,'0')).join(''));
    await open(K);
  }catch(ex){busy.style.display='none';err.style.display='block';}
});
</script>
